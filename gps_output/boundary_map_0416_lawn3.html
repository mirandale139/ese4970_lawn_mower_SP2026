
<!DOCTYPE html>
<html>
<head>
  <title>GPS Boundary</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

  var map = L.map('map').setView([38.6487125, -90.30219083333333], 18);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
  }).addTo(map);

  var boundaryCoords = [
    [38.6487125, -90.30219083333333],
[38.648705, -90.30220416666667],
[38.64869233333334, -90.30220616666666],
[38.64869683333333, -90.3021975],
[38.648691166666666, -90.302158],
[38.648416833333336, -90.30204466666666],
[38.648555, -90.302186],
[38.648603666666666, -90.30219],
[38.64862266666667, -90.30220116666666],
[38.648622833333334, -90.30224083333333],
[38.6486185, -90.3024],
[38.64859383333334, -90.30239833333333],
[38.64852966666667, -90.302409],
[38.648537833333336, -90.3024185],
[38.64848833333333, -90.30246366666667],
[38.648724666666666, -90.30242183333333],
[38.648732833333334, -90.30242483333333],
[38.6487425, -90.30243233333333],
[38.64873716666666, -90.30242583333333],
[38.64873333333333, -90.302412],
[38.648739666666664, -90.302411]
  ];

  var polygon = L.polygon(boundaryCoords, {
      color: 'blue',
      fillOpacity: 0.3
  }).addTo(map);

  // Add markers
  boundaryCoords.forEach(function(coord, index) {
      L.marker(coord).addTo(map)
        .bindPopup("Corner " + (index+1));
  });

  map.fitBounds(polygon.getBounds());

</script>

</body>
</html>
